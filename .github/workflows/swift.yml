# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Run ${{ matrix.xcode }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "Xcode_16.4"
            runsOn: macos-15
          - xcode: "Xcode_26.4"
            runsOn: macos-26
    steps:
      - uses: actions/checkout@v6
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/${{ matrix.xcode }}.app

      # Building swift-syntax takes most of `make test`. Sources checked out anew are newer than the
      # cache, so they are rebuilt; only the dependencies are reused.
      - name: Cache PrefireExecutable build
        uses: actions/cache@v4
        with:
          path: PrefireExecutable/.build
          key: prefire-executable-${{ matrix.xcode }}-${{ hashFiles('PrefireExecutable/Package.resolved') }}
          restore-keys: prefire-executable-${{ matrix.xcode }}-
        
      - name: Build Prefire
        run: make build

      - name: Run Prefire macOS Tests
        run: swift test

      - name: Run PrefireExecutable Tests
        run: make test

      - name: Build prefire CLI wrapper
        run: swift build -c release --product prefire

      - name: Smoke test prefire CLI wrapper
        run: |
          set -euo pipefail
          bin=$(pwd)/.build/release/prefire
          $bin --version
          $bin --help | grep -q "Generate Playbook"
          cd /tmp && $bin --version
          output=$(PREFIRE_BINARY_PATH=/nonexistent $bin --version 2>&1 || true)
          if echo "$output" | grep -q "failed to launch"; then
            echo "override error path works"
          else
            echo "expected 'failed to launch' error, got: $output" >&2
            exit 1
          fi

  ios-tests:
    name: iOS tests ${{ matrix.xcode }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "Xcode_16.4"
            runsOn: macos-15
          - xcode: "Xcode_26.4"
            runsOn: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/${{ matrix.xcode }}.app

      # SnapshotTesting brings swift-syntax along, which takes long to clone.
      - name: Cache iOS test packages
        uses: actions/cache@v4
        with:
          path: PrefireSnapshotTests/.build/SourcePackages
          key: ios-test-packages-${{ matrix.xcode }}-${{ hashFiles('PrefireSnapshotTests/Package.resolved') }}
          restore-keys: ios-test-packages-${{ matrix.xcode }}-

      - name: Run Prefire iOS Tests
        run: make test-ios
