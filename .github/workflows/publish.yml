name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 5.8.0). Runs `make update`, commits "Update version to X.X.X", tags, and publishes.'
        required: true
        type: string
  push:
    tags:
      - '*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z, got: ${INPUT_VERSION}"
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update version and commit
        id: bump
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BRANCH: ${{ github.ref_name }}
          GIT_USER: ${{ github.actor }}
          GIT_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          set -euo pipefail
          CURRENT="$(sed -n 's/.*static let value: String = "\([^"]*\)".*/\1/p' PrefireExecutable/Sources/prefire/Commands/Version/Version.swift)"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "::error::Already at version ${VERSION}. Push tag ${VERSION} to publish this commit, or pick a new version."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi

          make update version="${VERSION}"
          make test
          make mcpb

          bundled="Binaries/PrefireBinary.artifactbundle/prefire-${VERSION}-macos/bin/prefire"
          actual="$("$bundled" --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::Bundled CLI --version is '${actual}', expected '${VERSION}'"
            exit 1
          fi

          git config user.name "$GIT_USER"
          git config user.email "$GIT_EMAIL"
          git add -- \
            Binaries/PrefireBinary.artifactbundle \
            PrefireExecutable/Sources/prefire/Commands/Version/Version.swift \
            server.json
          git commit -m "Update version to ${VERSION}"
          git tag "${VERSION}"
          git push origin "HEAD:${BRANCH}" "refs/tags/${VERSION}"
          echo "rebuilt=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild bundled binary and MCP bundle from current source
        if: steps.bump.outputs.rebuilt != 'true'
        run: |
          make binary
          make mcpb

      - name: Create archive
        run: make archive

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            prefire.tar.gz
            prefire-mcp-${{ steps.version.outputs.value }}.mcpb

      # server.json points at the .mcpb of this release, with its SHA-256, written by `make mcpb`.
      - name: Keep server.json for the MCP Registry
        uses: actions/upload-artifact@v4
        with:
          name: server-json
          path: server.json
          if-no-files-found: error

  update-homebrew:
    needs: release
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: upgrade-brew-tap
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: Prefire
          homebrew-tap: barredewe/homebrew-prefire
          tag-name: ${{ needs.release.outputs.version }}
          download-url: "https://github.com/barredewe/prefire/releases/download/${{ needs.release.outputs.version }}/prefire.tar.gz"
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}

  publish-mcp-registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP Registry, for the io.github.BarredEwe/* names
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
    steps:
      - name: Download server.json
        uses: actions/download-artifact@v4
        with:
          name: server-json

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
