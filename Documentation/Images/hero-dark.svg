<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Prefire: turn #Preview into snapshot tests, a Playbook and AI-ready renders">
  <style>
    .chip { animation: pop 6s ease-out infinite both; }
    .c1 { animation-delay: .35s; } .c2 { animation-delay: .7s; } .c3 { animation-delay: 1.05s; }
    .flow { stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
    .flame { transform-origin: 86px 300px; animation: flick 2.4s ease-in-out infinite; }
    @keyframes pop { 0% { opacity: 0; transform: translateX(-14px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @keyframes flick { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05, .97); } }
    @media (prefers-reduced-motion: reduce) { .chip, .flow, .flame { animation: none; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1530"/><stop offset="1" stop-color="#0f0b18"/></linearGradient>
    <radialGradient id="g1" cx="0.12" cy="0" r="0.6"><stop offset="0" stop-color="#ff783c" stop-opacity="0.55"/><stop offset="1" stop-color="#ff783c" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="1" cy="1" r="0.6"><stop offset="0" stop-color="#7846ff" stop-opacity="0.55"/><stop offset="1" stop-color="#7846ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffd23f"/><stop offset=".45" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e5242b"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2263a"/><stop offset="1" stop-color="#7a1530"/></linearGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#g1)"/>
  <rect width="1280" height="400" rx="28" fill="url(#g2)"/>

  <g transform="translate(64 64)">
    <rect width="88" height="88" rx="22" fill="url(#tile)"/>
    <g transform="translate(-42 -256)"><g class="flame">
      <path d="M86 334 C 62 334 52 316 56 298 C 60 282 72 276 74 262 C 84 272 86 282 84 292 C 92 286 96 278 96 270 C 110 284 116 300 112 312 C 108 326 98 334 86 334 Z" fill="url(#fl)"/>
      <path d="M86 334 C 76 334 70 326 72 316 C 74 308 80 304 82 296 C 90 304 96 312 94 322 C 92 330 90 334 86 334 Z" fill="#fff3b0" opacity=".9"/>
    </g></g>
  </g>
  <text x="172" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5" fill="#ffffff">Prefire</text>
  <text x="66" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Your <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ffd2b8">#Preview</tspan> blocks, put to work.</text>
  <text x="66" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#c9c0dd">Snapshot tests, a Playbook catalog and renders an AI agent</text>
  <text x="66" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#c9c0dd">can see, generated from the previews you already write.</text>

  <g transform="translate(66 318)">
    <rect width="400" height="50" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="18" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#c9c0dd"><tspan fill="#ff7ab6">#Preview</tspan> { LoginView() }</text>
  </g>
  <path class="flow" d="M 480 343 C 650 343 690 208 846 208" fill="none" stroke="#ffd2b8" stroke-width="2.5" opacity=".7"/>
  
    <g transform="translate(860 92)"><g class="chip c0">
      <rect width="300" height="46" rx="23" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
      <circle cx="26" cy="23" r="7" fill="#ff6a3d"/>
      <text x="44" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#f4f0ff">Snapshot tests</text>
    </g></g>
    <g transform="translate(860 154)"><g class="chip c1">
      <rect width="300" height="46" rx="23" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
      <circle cx="26" cy="23" r="7" fill="#8b5cf6"/>
      <text x="44" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#f4f0ff">Playbook</text>
    </g></g>
    <g transform="translate(860 216)"><g class="chip c2">
      <rect width="300" height="46" rx="23" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
      <circle cx="26" cy="23" r="7" fill="#22c55e"/>
      <text x="44" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#f4f0ff">User stories</text>
    </g></g>
    <g transform="translate(860 278)"><g class="chip c3">
      <rect width="300" height="46" rx="23" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
      <circle cx="26" cy="23" r="7" fill="#3b82f6"/>
      <text x="44" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#f4f0ff">AI-ready renders</text>
    </g></g>
</svg>
